<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom ML Chatbot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="chat-shell">
    <header>
      <div><span class="status-dot"></span> Local ML</div>
      <h1>Custom Chatbot</h1>
      <p>Paragraphs and professional messages, generated locally.</p>
    </header>
    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">Hello! Ask for a paragraph or a formal message.</article>
    </section>
    <form id="chat-form">
      <textarea id="message" rows="2" placeholder="Write a paragraph about cybersecurity…" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="notice" class="notice">Set the service key to connect.</p>
    <details>
      <summary>Connection settings</summary>
      <label>Service key <input id="api-key" type="password" autocomplete="off"></label>
      <button id="connect" type="button">Connect</button>
    </details>
  </main>
  <script src="/app.js"></script>
</body>
</html>
