apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
data:
  RATE_LIMIT_STORAGE_URI: redis://redis.production.svc:6379/1
  RAG_CHROMA_HOST: chroma
  RAG_CHROMA_PORT: "8000"
  SERVER_LIMIT_CONCURRENCY: "200"
  MAX_REQUEST_BODY_BYTES: "2100000"
  WEB_CONCURRENCY: "2"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-general
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: chatbot
      role: general
  template:
    metadata:
      labels:
        app: chatbot
        role: general
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chatbot
              role: general
      containers:
        - name: chatbot
          image: ghcr.io/replace-me/chatbot-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
          env:
            - name: SERVICE_ROLE
              value: general
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: service-api-key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-general
spec:
  selector:
    app: chatbot
    role: general
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatbot-general
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatbot-general
  minReplicas: 4
  maxReplicas: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 10
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chatbot-general
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: chatbot
      role: general
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chatbot
      role: rag
  template:
    metadata:
      labels:
        app: chatbot
        role: rag
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: chatbot
              role: rag
      containers:
        - name: chatbot
          image: ghcr.io/replace-me/chatbot-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
          env:
            - name: SERVICE_ROLE
              value: rag
            - name: RAG_WARMUP_ON_STARTUP
              value: "true"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: service-api-key
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-rag
spec:
  selector:
    app: chatbot
    role: rag
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatbot-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatbot-rag
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chatbot-rag
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: chatbot
      role: rag
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:1.4.1
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
spec:
  clusterIP: None
  selector:
    app: chroma
  ports:
    - port: 8000
      targetPort: 8000
